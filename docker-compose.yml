# Optional local Postgres for development — an alternative to the cloud Neon DB.
# The app runs on the host (`npm run dev`); this only provides a database.
#
#   1. Start it:   docker compose up -d
#   2. Point .env at it:
#        DATABASE_URI=postgres://postgres:postgres@127.0.0.1:5432/sealife-sealrescue
#   3. Stop it:    docker compose down   (add -v to also wipe the data volume)
#
# Not required if you use Neon. Requires Docker Desktop, which isn't installed yet.

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sealife-sealrescue
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
