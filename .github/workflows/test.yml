name: Tests

# Runs the unit/integration (Vitest) + e2e (Playwright) suites on every PR and on main, so
# regressions are caught before deploy. This is the CI home for guards like the leaderboard
# auto-scroll (tests/e2e/game-leaderboard-scroll.e2e.spec.ts), which needs a real browser
# (jsdom has no layout/rAF). The game e2e tests are DB-free (network mocked); the int + admin/
# frontend e2e tests use the dev Postgres via DATABASE_URI (schema auto-syncs in dev/push mode).

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Install Playwright Chromium (+ OS deps)
        run: npx playwright install --with-deps chromium

      - name: Run tests (Vitest + Playwright)
        # Playwright's webServer starts `npm run dev` and waits for :3000 (see playwright.config.ts).
        run: npm test
        env:
          CI: '1'
          # Dev Postgres (Neon) — schema auto-syncs in dev/push mode; NOT the prod DB. Same secret as deploy.
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_PLAUSIBLE_SRC: ''
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
