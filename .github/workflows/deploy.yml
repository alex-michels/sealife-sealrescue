name: Deploy (main → VPS)

# Single source of truth = main. Build a lean Next standalone artifact in CI → rsync it to the
# VPS → repoint the `current` symlink → restart systemd. See docs/DEPLOYMENT.md.
#
# ── 2026-07-12: публичная альфа игры выведена из эксплуатации (сервисы на боксе остановлены,
# см. shutdown-alpha.yml) — АВТО-деплой по push в main ВЫКЛЮЧЕН на время локальной разработки.
# Workflow остаётся для будущего QA/prod (ручной запуск). Проект живёт только на sealife.info
# и sealrescue.info (плюс их поддомены), поэтому цель финального health-check задаётся входом
# `health_url` — указывайте URL того окружения, куда деплоите. Auto-push вернуть =
# раскомментировать блок `push:` ниже.
#
# Why build in CI: the box is 8 GB and `next build` runs with --max-old-space-size=8000; building
# on-box next to Postgres risks OOM. CI builds; the box just runs `node server.js`.
#
# Required repo secrets:
#   SSH_HOST        VPS IP / hostname
#   SSH_USER        deploy user (non-root, sudo for `systemctl restart sealife`)
#   SSH_KEY         private key (ed25519) whose public key is in deploy@VPS authorized_keys
#   DATABASE_URI    DEV/Neon Postgres — used ONLY to satisfy build-time reads (the sealife home
#                   page is statically prerendered and queries Payload). NOT the prod DB.
#   PAYLOAD_SECRET  any non-empty build-time value (real prod secret lives in /etc/sealife/.env)

on:
  # push:
  #   branches: [main]
  workflow_dispatch:
    inputs:
      health_url:
        description: Базовый URL окружения для финального health-check (sealife.info / sealrescue.info или их поддомен)
        type: string
        required: false
        default: https://sealife.info

concurrency:
  group: deploy-main
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Persist Next's build cache across runs (silences the "No build cache found" notice).
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      # Схема пока push-based (миграций нет): `next build` (NODE_ENV=production) push НЕ делает,
      # а пререндер читает БД живьём — новая коллекция/global без этого шага валит сборку
      # («relation … does not exist», инцидент PR #53). Идемпотентно; тот же скрипт, что в CI e2e.
      # Заодно актуализирует схему БД окружения ДО рестарта рантайма (он смотрит в ту же ветку).
      # `echo y |` авто-подтверждает data-loss prompt drizzle (интерактивный TTY-вопрос в CI иначе
      # виснет; первый случай — удаление колонки `board` в SH-11). Осознанный трейдофф push-фазы:
      # данные лидерборда в не-prod окружениях анонимны и прунятся; перед prod — миграции (Roadmap).
      - name: Sync DB schema (drizzle push)
        run: echo y | npx tsx scripts/push-dev-schema.mts
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}

      - name: Build (Next standalone)
        run: npm run build
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          NEXT_PUBLIC_PLAUSIBLE_SRC: ''
          # No-tracking project: keep Next telemetry off in CI too.
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Assemble artifact (standalone + static + public)
        run: |
          set -e
          rm -rf artifact && mkdir -p artifact
          cp -r .next/standalone/. artifact/
          mkdir -p artifact/.next
          cp -r .next/static artifact/.next/static
          cp -r public artifact/public

      - uses: actions/upload-artifact@v7
        with:
          name: app
          path: artifact
          retention-days: 3
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: app
          path: artifact

      - name: Configure SSH
        run: |
          set -e
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Rsync release to VPS
        run: |
          set -e
          REL="/opt/sealife/releases/${{ github.sha }}"
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" "mkdir -p $REL"
          rsync -az --delete -e "ssh -i ~/.ssh/id_ed25519" artifact/ \
            "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:$REL/"

      - name: Activate release + restart service
        run: |
          ssh -i ~/.ssh/id_ed25519 "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "set -e; \
             ln -sfn /opt/sealife/releases/${{ github.sha }} /opt/sealife/current; \
             sudo systemctl restart sealife; \
             ls -1dt /opt/sealife/releases/*/ | tail -n +6 | xargs -r rm -rf"

      - name: Health check (game + leaderboard reachable)
        env:
          # Fallback дублирует default инпута — нужен, если вернут триггер `push:` (там inputs пуст).
          HEALTH_URL: ${{ inputs.health_url || 'https://sealife.info' }}
        run: |
          set -e
          BASE="${HEALTH_URL%/}"
          for i in $(seq 1 10); do
            if curl -fsS "$BASE/api/leaderboard?game=seal-the-hunter" >/dev/null; then
              echo "healthy"; exit 0
            fi
            echo "waiting for app… ($i)"; sleep 3
          done
          echo "health check failed: $BASE"; exit 1
