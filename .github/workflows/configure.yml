name: Configure VPS (Ansible)

# Manually-triggered day-2 server configuration (idempotent). The frequent app deploys are
# handled by deploy.yml; THIS runs the Ansible playbook (base/node/caddy/app, later postgres)
# from a Linux runner so you don't need WSL. See infra/ansible/ + docs/INFRA.md.
#
# Required secrets (same as deploy.yml, plus the values written into the env file):
#   SSH_HOST, SSH_USER, SSH_KEY, DATABASE_URI, PAYLOAD_SECRET
# DATABASE_URI/PAYLOAD_SECRET are written into /etc/sealife/.env on first apply.
#
# Prereq: the `deploy` user (with passwordless sudo) + its public key already exist on the box —
# provisioned by deploy/cloud-init.yaml (cntb reinstall) or a one-time manual root bootstrap.
# (If you instead give `deploy` password-protected sudo, add a SUDO_PASSWORD secret and pass
#  --extra-vars "ansible_become_password=${{ secrets.SUDO_PASSWORD }}" below.)

on:
  workflow_dispatch:

concurrency:
  group: configure-vps
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible + collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/sealife_deploy
          chmod 600 ~/.ssh/sealife_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run playbook
        working-directory: infra/ansible
        run: |
          printf '[sealife]\n%s ansible_user=%s\n' \
            "${{ secrets.SSH_HOST }}" "${{ secrets.SSH_USER }}" > /tmp/ci-inventory.ini
          ansible-playbook site.yml \
            -i /tmp/ci-inventory.ini \
            --private-key ~/.ssh/sealife_deploy \
            --extra-vars "database_uri=${{ secrets.DATABASE_URI }}" \
            --extra-vars "payload_secret=${{ secrets.PAYLOAD_SECRET }}"
