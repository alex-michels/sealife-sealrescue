name: Shutdown alpha (VPS)

# Гасит публичную поверхность VPS: останавливает и выключает systemd-сервисы `sealife`
# (приложение) и `caddy` (reverse proxy) через infra/ansible/shutdown.yml. Так была выведена
# из эксплуатации публичная альфа игры; тот же выключатель годится для будущих QA/stage.
# Бокс, Node, каталоги и /etc/sealife/.env остаются — поднять обратно = Configure → Deploy
# (раннбук в docs/DEPLOYMENT.md §5). Идемпотентно.
#
# Защита от случайного клика: в поле confirm надо вписать ровно `shutdown-alpha`.
#
# Secrets: SSH_HOST, SSH_USER, SSH_KEY (как у configure.yml; БД не нужна).

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Впишите `shutdown-alpha`, чтобы подтвердить остановку публичных сервисов на боксе
        type: string
        required: true

concurrency:
  group: configure-vps # общая группа с Configure — не гоняться с ним за один бокс
  cancel-in-progress: false

jobs:
  shutdown:
    runs-on: ubuntu-latest
    if: inputs.confirm == 'shutdown-alpha'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Ansible + collections
        run: |
          python -m pip install --upgrade pip
          pip install ansible
          ansible-galaxy collection install -r infra/ansible/requirements.yml

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/sealife_deploy
          chmod 600 ~/.ssh/sealife_deploy
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null

      - name: Run shutdown playbook
        working-directory: infra/ansible
        run: |
          printf '[sealife]\n%s ansible_user=%s\n' \
            "${{ secrets.SSH_HOST }}" "${{ secrets.SSH_USER }}" > /tmp/ci-inventory.ini
          ansible-playbook shutdown.yml \
            -i /tmp/ci-inventory.ini \
            --private-key ~/.ssh/sealife_deploy
