name: Seed database

# Manually seed the database pointed to by the DATABASE_URI secret. Use this to bootstrap a fresh
# DB (new Neon branch, prod, etc.) with the MUST-HAVE baseline records. Idempotent.
#
# Runs on Node 22 ON PURPOSE: `payload run` uses tsx, which doesn't yet support Node 24's module
# loader. (The app build + runtime run on Node 24; only these tsx-based seed scripts need 22.)
#
# Uses secrets: DATABASE_URI (the target DB), PAYLOAD_SECRET.

on:
  workflow_dispatch:
    inputs:
      seed:
        description: Which seed to run against DATABASE_URI
        type: choice
        default: baseline
        options:
          - baseline   # must-have records only (games) — safe for prod
          - glossary   # i18n glossary
          - m1         # baseline + demo content (articles/species/memes) — dev/alpha only
      confirm:
        description: 'Type the seed name again to confirm (guards against a misclick on the wrong DB)'
        type: string
        required: true

concurrency:
  group: seed-db
  cancel-in-progress: false

jobs:
  seed:
    runs-on: ubuntu-latest
    steps:
      # CR-03: до этого шага сид был тремя кликами в UI против единственного репозиторного
      # DATABASE_URI, без environment-гейта и без подтверждения — то есть ничто не отличало
      # прод-БД от dev-БД в момент запуска. Совпадение с выбранным сидом набирается руками.
      - name: Confirm the target seed
        if: inputs.confirm != inputs.seed
        run: |
          echo "::error::confirm='${{ inputs.confirm }}' не совпадает с seed='${{ inputs.seed }}' — запуск отменён."
          exit 1

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Seed (${{ inputs.seed }})
        run: npm run seed:${{ inputs.seed }}
        env:
          DATABASE_URI: ${{ secrets.DATABASE_URI }}
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
