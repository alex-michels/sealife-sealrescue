<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Тюль-Охотник</title>
  <meta name="description" data-i18n-content="metaDescription" content="Мобильная игра про тюленя — лови рыбу за 60 секунд!">
  <meta name="theme-color" content="#1E5B5B">

  <!-- Link preview (Open Graph + Twitter). Static EN canonical: the game lives on sealife.info,
       framed by the games page. Absolute URLs are required by scrapers; the cover must stay JPEG
       (some scrapers reject WebP/AVIF). -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="SeaLife.Info">
  <meta property="og:title" content="Seal The Hunter — a web game">
  <meta property="og:description" content="Catch fish as a seal in 60 seconds. A quick browser game with a weekly leaderboard.">
  <meta property="og:url" content="https://sealife.info/en/games/seal-the-hunter">
  <meta property="og:image" content="https://sealife.info/games/seal-hunt-v1/assets/cover.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Seal The Hunter — a cartoon seal hunting fish underwater">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Seal The Hunter — a web game">
  <meta name="twitter:description" content="Catch fish as a seal in 60 seconds.">
  <meta name="twitter:image" content="https://sealife.info/games/seal-hunt-v1/assets/cover.jpg">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="hud" role="toolbar" data-i18n-aria="hudAriaLabel" aria-label="Панель игры">
    <div class="left">
      <span data-i18n-title="hudTimeTitle" title="Оставшееся время">⏱️ <span id="time">60</span>s</span>
      <span data-i18n-title="hudScoreTitle" title="Очки">🐟 <span id="score">0</span></span>
      <span data-i18n-title="hudBestTitle" title="Рекорд на этом устройстве">🏆 <span id="best">0</span></span>
    </div>
    <div class="right">
      <button id="btnStart" class="primary" data-i18n="btnStart">Старт</button>
      <button id="btnPause" aria-pressed="false" data-i18n="btnPause">Пауза</button>
      <button id="btnSound" aria-pressed="false" data-i18n-title="btnSoundTitle" title="Звук">🔊</button>
    </div>
  </div>

  <canvas id="game" data-i18n-aria="canvasAriaLabel" aria-label="Игровое поле: тюлень охотится за рыбой"></canvas>

  <!-- Standalone-заглушка (SH-14, тумблер games.standaloneComingSoon в админке): фон с плавающей
       рыбой рисует canvas (attract-режим game.js), тут только надпись. Во фрейме не бывает. -->
  <div id="comingSoon" hidden aria-live="polite">
    <span class="coming-soon-text">Coming&nbsp;soon</span>
  </div>

  <div id="overlay" hidden>
    <!-- Переключатель языка — только standalone (игра открыта прямым URL); во фрейме скрыт. -->
    <div id="langSwitch" class="lang-switch" role="group" data-i18n-aria="langSwitchLabel" hidden>
      <button type="button" class="lang-btn" data-lang="ru" lang="ru">RU</button>
      <button type="button" class="lang-btn" data-lang="en" lang="en">EN</button>
    </div>
    <h1 data-i18n="title">Тюль-Охотник</h1>
    <p id="hello" class="hello"></p>
    <p id="message"></p>
    <div class="overlay-buttons">
      <button id="btnAgain" class="primary" data-i18n="btnAgain">Играть ещё</button>
      <button id="btnShareEnd" data-i18n="btnShareEnd" data-i18n-title="btnShareEndTitle" title="Поделиться результатом" hidden>Поделиться</button>
    </div>
    <div id="board" class="board" hidden></div>
  </div>

  <noscript data-i18n="noscript">Для игры нужен JavaScript.</noscript>

  <script src="i18n.js"></script>
  <script type="module" src="game.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
    }
  </script>
</body>
</html>
