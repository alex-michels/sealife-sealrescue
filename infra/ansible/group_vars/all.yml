# Non-secret configuration. SECRETS (DATABASE_URI, PAYLOAD_SECRET) are NOT kept here —
# they live in /etc/sealife/.env on the box (filled once, never overwritten by Ansible),
# or pass them at run time via --extra-vars / ansible-vault. NEVER commit real secret values.
---
node_major: 24
app_user: deploy
app_dir: /opt/sealife
env_file: /etc/sealife/.env

# Templated into {{ env_file }} as SERVER_URL. ПЕРЕОПРЕДЕЛЯТЬ ПОД ОКРУЖЕНИЕ (stage vs prod,
# sealife.info vs sealrescue.info) через --extra-vars или host_vars: неверный SERVER_URL
# молча ломает canonical/hreflang/sitemap-URL — страницы отдадут чужой домен.
server_url: https://sealife.info

# CR-04/CR-18: каталог загрузок. ОБЯЗАН быть вне {{ app_dir }}/releases — иначе следующий деплой
# снесёт все загруженные картинки вместе со старым релизом. Шаг деплоя проверяет это и
# отказывается активировать релиз, если путь пуст, относителен или ведёт внутрь releases/.
media_dir: /opt/sealife/shared/media

# Public keys allowed to log in as `deploy` (same keypair as the CI SSH_KEY secret).
# Paste one or more "ssh-ed25519 AAAA... comment" lines.
deploy_authorized_keys: []
