# Edit YOUR_VPS_IP. The deploy user + its SSH key must already exist on the box
# (created by the cloud-init bootstrap or the manual runbook in DEPLOYMENT.md §5 steps 1-3).
[sealife]
prod ansible_host=YOUR_VPS_IP

[sealife:vars]
ansible_user=deploy
ansible_ssh_private_key_file=~/.ssh/sealife_deploy
