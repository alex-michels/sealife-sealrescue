[defaults]
inventory = inventory.ini
roles_path = roles
host_key_checking = True
retry_files_enabled = False
# YAML-formatted output via the built-in default callback. (The old community.general.yaml
# stdout callback was removed in community.general 12 / ansible-core 2.21.)
result_format = yaml
interpreter_python = auto_silent

[privilege_escalation]
become = True
